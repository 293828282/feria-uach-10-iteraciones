<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Institutional Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="1.8" />

  <!-- Shield and Emblem -->
  <g filter="url(#shadow)">
    <!-- Heraldic Shield Silhouette -->
    <path d="M32 9 C43 9 49 13 50 23 C50 36.5 38 47.5 32 53 C26 47.5 14 36.5 14 23 C15 13 21 9 32 9 Z" 
          fill="#082f49" 
          stroke="url(#goldGrad)" 
          stroke-width="2.2" />

    <!-- Inner Golden Trim Line -->
    <path d="M32 12 C40 12 45 15 46 23 C46 34 36 43.5 32 48 C28 43.5 18 34 18 23 C19 15 24 12 32 12 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="1" 
          opacity="0.55" />

    <!-- University Flame of Knowledge / Antorcha Academica -->
    <!-- Main Outer Flame -->
    <path d="M32 15 C35 18 37 22 35 25 C33.5 24 32.5 23 32 21 C31.5 23 30.5 24 29 25 C27 22 29 18 32 15 Z" 
          fill="url(#goldGrad)" />
    <!-- Inner Core Flame -->
    <path d="M32 19 C33.5 20.5 34 22.5 33 24 C32.5 23.5 32 23 32 22 C32 23 31.5 23.5 31 24 C30 22.5 30.5 20.5 32 19 Z" 
          fill="#ffffff" />
    <!-- Torch Mount -->
    <path d="M29 26.5 L35 26.5 L33.5 31 L30.5 31 Z" fill="url(#silverGrad)" stroke="url(#goldGrad)" stroke-width="0.75" />

    <!-- UACH Monogram / Sigla Institucional -->
    <text x="32" y="42" 
          font-family="'Times New Roman', Georgia, serif" 
          font-size="9.5" 
          font-weight="bold" 
          letter-spacing="0.5" 
          text-anchor="middle" 
          fill="#ffffff">UACh</text>

    <!-- Star of Innovation at Shield Tip -->
    <polygon points="32,44 32.9,46.5 35.5,46.5 33.4,48 34.2,50.5 32,49 29.8,50.5 30.6,48 28.5,46.5 31.1,46.5" 
             fill="url(#goldGrad)" />
  </g>
</svg>
